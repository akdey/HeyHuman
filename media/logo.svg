<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Siren Glow -->
    <radialGradient id="sirenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3B30" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#EF4444" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0" />
    </radialGradient>

    <!-- Beacon Bulb Gradient -->
    <linearGradient id="bulbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF453A" />
      <stop offset="50%" stop-color="#FF9F0A" />
      <stop offset="100%" stop-color="#FF3B30" />
    </linearGradient>

    <!-- Robot Visor Gradient -->
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" />

  <!-- Siren Light Glow Effect -->
  <circle cx="256" cy="100" r="110" fill="url(#sirenGlow)" />

  <!-- Siren Alarm Sound Waves (Left & Right) -->
  <path d="M 180 75 C 160 88 160 112 180 125" fill="none" stroke="#FF453A" stroke-width="7" stroke-linecap="round" />
  <path d="M 155 58 C 130 80 130 120 155 142" fill="none" stroke="#FF9F0A" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 1" />
  
  <path d="M 332 75 C 352 88 352 112 332 125" fill="none" stroke="#FF453A" stroke-width="7" stroke-linecap="round" />
  <path d="M 357 58 C 382 80 382 120 357 142" fill="none" stroke="#FF9F0A" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 1" />

  <!-- Emergency Siren Beacon -->
  <!-- Base Mount -->
  <rect x="226" y="126" width="60" height="18" rx="6" fill="#475569" stroke="#64748B" stroke-width="3" />
  <!-- Dome -->
  <path d="M 230 126 C 230 84 282 84 282 126 Z" fill="url(#bulbGrad)" stroke="#FFD60A" stroke-width="4" />
  <!-- Beacon Core Highlight -->
  <ellipse cx="256" cy="108" rx="14" ry="18" fill="#FFF" opacity="0.6" />

  <!-- Robot Antenna Stem connecting to head -->
  <line x1="256" y1="144" x2="256" y2="164" stroke="#64748B" stroke-width="8" stroke-linecap="round" />

  <!-- Robot Ears (Bolts / Screws) -->
  <rect x="96" y="248" width="22" height="54" rx="7" fill="#334155" stroke="#38BDF8" stroke-width="4" />
  <rect x="394" y="248" width="22" height="54" rx="7" fill="#334155" stroke="#38BDF8" stroke-width="4" />

  <!-- Robot Head Outline -->
  <rect x="114" y="164" width="284" height="232" rx="46" fill="#1E293B" stroke="#38BDF8" stroke-width="9" />

  <!-- Robot Visor Screen -->
  <rect x="146" y="202" width="220" height="124" rx="26" fill="url(#visorGrad)" stroke="#0284C7" stroke-width="5" />

  <!-- Sarcastic / Impatient LED Eyes (Half-closed "Are you serious?" look) -->
  <!-- Left Eye -->
  <path d="M 180 252 L 232 252" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" />
  <line x1="182" y1="264" x2="230" y2="264" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" opacity="0.4" />
  <!-- Eyelid angle giving sarcastic glare -->
  <path d="M 174 242 L 238 248" stroke="#1E293B" stroke-width="8" stroke-linecap="round" />

  <!-- Right Eye -->
  <path d="M 280 252 L 332 252" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" />
  <line x1="282" y1="264" x2="330" y2="264" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" opacity="0.4" />
  <!-- Eyelid angle -->
  <path d="M 274 248 L 338 242" stroke="#1E293B" stroke-width="8" stroke-linecap="round" />

  <!-- Impatient Flat Mouth Line -->
  <path d="M 228 300 Q 256 304 284 300" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" />

  <!-- Interactive "PERMISSION?" Badge / Dialog Button at the bottom -->
  <g transform="translate(166, 350)">
    <rect x="0" y="0" width="180" height="34" rx="10" fill="#0F172A" stroke="#EF4444" stroke-width="3.5" />
    <!-- Blinking alert dot -->
    <circle cx="20" cy="17" r="5" fill="#EF4444" />
    <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#F8FAFC" letter-spacing="1">ALLOW? [Y/n]</text>
  </g>

  <!-- Tiny Sarcastic Speech bubble: "HEY HUMAN!" in top-right -->
  <g transform="translate(325, 140)">
    <rect x="0" y="0" width="125" height="36" rx="10" fill="#EF4444" stroke="#FFFFFF" stroke-width="2.5" />
    <polygon points="18,36 12,46 32,36" fill="#EF4444" />
    <text x="62" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">HEY HUMAN!</text>
  </g>
</svg>
